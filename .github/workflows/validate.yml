name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test tools
        run: python -m pip install -r requirements_test.txt
      - name: Compile Python
        run: python -m compileall -q custom_components
      - name: Lint
        run: ruff check custom_components tests
      - name: Test
        run: pytest

  runtime-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements_test.txt
            requirements_runtime_test.txt
      - name: Install Home Assistant runtime test tools
        run: python -m pip install -r requirements_runtime_test.txt
      - name: Test Home Assistant runtime integration
        run: pytest tests/test_runtime.py
