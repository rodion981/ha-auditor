# Keep the token in secrets.yaml. The integration also works without a token,
# but checks only max_requests_per_run repositories per run.
custom_components_auditor:
  github_token: !secret custom_components_auditor_github_token
  # Optional. Omit this line to disable push notifications.
  notify_service: notify.mobile_app_your_phone
  daily_hour: 9
  weekly_weekday: 6
  max_requests_per_run: 45
